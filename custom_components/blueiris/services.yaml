trigger_camera:
  name: Trigger Camera
  description: Triggers the selected camera in Blue Iris
  target:
    entity:
      integration: blueiris
      domain: camera

move_to_preset:
  name: Move to Preset
  description: Moves the selected camera to the specified preset
  target:
    entity:
      integration: blueiris
      domain: camera
  fields:
    preset:
      name: Preset
      description: Desired preset number
      required: true
      default: 1
      example: 1
      selector:
        number:
          min: 1
          max: 40
          step: 1
          mode: box

reload:
  name: Reload
  description: Reload one Blue Iris config entry, or all entries if no entry_id is provided.
  fields:
    entry_id:
      name: Config entry ID
      description: The config entry ID to reload. If omitted, all Blue Iris entries are reloaded.
      example: 01KJNTBTYN82YCCX7WB5J2J3CT
      required: false
      selector:
        text:

latest_motion_event_snapshot:
  name: Latest Motion Event Snapshot
  description: Saves the latest Blue Iris alert image for the selected camera and returns motion event metadata. The alert search currently looks back up to 24 hours.
  target:
    entity:
      integration: blueiris
      domain: camera
  fields:
    filename:
      name: Filename
      description: >
        Optional filename for the saved snapshot. If omitted, the integration
        will create one automatically, such as driveway_latest_motion.jpg.
        Files are stored in the Home Assistant local media directory under
        blueiris and are available through /media/local/blueiris/.
      required: false
      example: driveway_latest_motion.jpg
      selector:
        text:
    create_public_copy:
      name: Create public copy
      description: >-
        Also save a copy under /config/www/blueiris and return public_snapshot_url.
        This is useful for legacy notification clickAction URLs, but the public copy
        is accessible without Home Assistant authentication via /local/blueiris/.
      required: false
      example: false
      selector:
        boolean:

current_camera_snapshot:
  name: Current Camera Snapshot
  description: Saves the current live still image for a Blue Iris camera.
  target:
    entity:
      integration: blueiris
      domain: camera
  fields:
    filename:
      name: Filename
      description: >
        Optional filename for the saved snapshot. If omitted, the integration
        will create one automatically, such as driveway_current.jpg.
        Files are stored in the Home Assistant local media directory under
        blueiris and are available through /media/local/blueiris/.
      required: false
      example: driveway_current.jpg
      selector:
        text:
    create_public_copy:
      name: Create public copy
      description: >-
        Also save a copy under /config/www/blueiris and return public_snapshot_url.
        This is useful for legacy notification clickAction URLs, but the public copy
        is accessible without Home Assistant authentication via /local/blueiris/.
      required: false
      example: false
      selector:
        boolean: